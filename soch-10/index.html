<body>
<header class="top"><div class="wrap topin"><div class="identity"><div class="mark">10</div><div><h1>Подготовка к СОЧ</h1><small>Информатика и искусственный интеллект · 1 четверть</small></div></div><div class="mode-switch" role="group" aria-label="Режим работы"><button data-mode="lesson" class="active">Разбор</button><button data-mode="practice">Тренировка</button></div></div></header>
<div id="app" class="wrap"></div>

'use strict';
const topics=[
 {short:'История ИИ',title:'Развитие искусственного интеллекта',sub:'Этапы ИИ и влияние вычислений, данных и алгоритмов',points:4},
 {short:'Понятия МО',title:'Основные понятия машинного обучения',sub:'Обучающие данные, признаки, модель, обучение и прогноз',points:4},
 {short:'Перцептрон',title:'Как устроен перцептрон',sub:'Входы → веса → сумма → активация → выход',points:3},
 {short:'Расчёт',title:'Расчёт перцептрона',sub:'Вычислим S и y, затем изменим вес',points:5},
 {short:'Виды обучения',title:'Три вида машинного обучения',sub:'С учителем, без учителя, с подкреплением',points:3},
 {short:'k-means',title:'Алгоритм k-means',sub:'Распределяем по ближайшим центрам и пересчитываем их',points:3},
 {short:'k-NN',title:'Алгоритм k-NN',sub:'Определяем класс по ближайшим соседям',points:3},

];
const assessment=[
 [
  {id:'a01',q:'Какой этап появился раньше?',kind:'select',opts:['Генеративные модели','Экспертные системы на правилах','Современные большие языковые модели'],answer:'1',ex:'Экспертные системы появились раньше современного глубокого обучения.'},
  {id:'a02',q:'Чем характерен современный этап ИИ?',kind:'select',opts:['Только ручные правила','Обучение глубоких нейросетей на больших данных','Отсутствие обучения'],answer:'1',ex:'Современные нейросети обучаются на данных.'},
  {id:'a03',q:'Как вычислительные мощности и GPU помогли ИИ?',kind:'select',opts:['Ускорили обучение сложных моделей','Убрали необходимость в данных','Заменили алгоритмы правилами'],answer:'0',ex:'Параллельные вычисления ускоряют обучение нейросетей.'},
  {id:'a04',q:'Зачем нужны большие качественные наборы данных?',kind:'select',opts:['Чтобы модели лучше находили закономерности и работали на новых примерах','Чтобы обучение стало ненужным','Чтобы все ответы были одинаковыми'],answer:'0',ex:'Качественные разнообразные данные помогают обучению и обобщению.'}
 ],
 [

  {id:'a12',q:'Какие два признака помогут прогнозировать цену автомобиля?',kind:'select',opts:['Пробег и год выпуска','Цена продажи и прогноз цены','Ответ модели и ошибка'],answer:'0',ex:'Признаки — входные характеристики объекта.'},
  {id:'a13',q:'Чем модель отличается от обучения?',kind:'select',opts:['Модель — результат настройки зависимости, обучение — процесс её настройки','Это одно и то же','Обучение выдаёт только случайные ответы'],answer:'0',ex:'Модель используется для прогноза, а обучение настраивает её по примерам.'},
  {id:'a14',q:'Что выдаст модель для нового автомобиля?',kind:'select',opts:['Прогнозируемую цену','Список всех обучающих автомобилей','Обязательно точную цену без ошибки'],answer:'0',ex:'Результат — предполагаемая цена нового объекта.'}
 ],
 [

  {id:'a22',q:'Для чего нужны веса w₁ и w₂?',kind:'select',opts:['Задают влияние каждого входа','Определяют цвет таблицы','Всегда равны единице'],answer:'0',ex:'Вес усиливает или ослабляет вклад признака во взвешенную сумму.'},

 ],
 [
  {id:'a31',q:'S = x₁w₁ + x₂w₂. Веса 0,2 и 0,5. В строке 2 входы (0; 1), в строке 3 — (1; 1). Запиши S₂; S₃.',kind:'numbers',answer:[.5,.7],placeholder:'Например: 0,2; 0,4',ex:'S₂ = 0·0,2 + 1·0,5 = 0,5. S₃ = 1·0,2 + 1·0,5 = 0,7.'},

  {id:'a33',q:'В A и B — входы; в C и D — веса. Как записать формулу суммы для E2?',kind:'formulaSum',answer:'=A2*C2+B2*D2',placeholder:'=...',ex:'Формула: =A2*C2+B2*D2'},
  {id:'a34',q:'Напиши формулу для F2 через ЕСЛИ при пороге 0,9.',kind:'formulaIf',answer:'=ЕСЛИ(E2>=0,9;1;0)',placeholder:'=ЕСЛИ(...)',ex:'Формула: =ЕСЛИ(E2>=0,9;1;0) или =IF(E2>=0.9,1,0).'},

 ],
 [
  {id:'a41',q:'Есть фотографии растений с готовыми правильными названиями. Какое обучение?',kind:'select',opts:['Без учителя','С учителем','С подкреплением'],answer:'1',ex:'Есть правильные метки — обучение с учителем.'},
  {id:'a42',q:'Модель сама объединяет схожие покупки без готовых категорий. Какое обучение?',kind:'select',opts:['С учителем','С подкреплением','Без учителя'],answer:'2',ex:'Готовых меток нет — обучение без учителя.'},
  {id:'a43',q:'Агент получает награды за удачные действия и штрафы за ошибки. Какое обучение?',kind:'select',opts:['С подкреплением','Без учителя','С учителем'],answer:'0',ex:'Награды и штрафы — обучение с подкреплением.'}

 [

const state={section:0,mode:'lesson',visible:{},values:{},checked:{},per:{x1:1,x2:1,w1:.4,w2:.3,t:.8},kmStep:0,knnK:3,knnReveal:false,reg:{x:4,fact:17}};
const h=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const ru=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const sumPoints=arr=>arr.reduce((s,x)=>s+(x.points||1),0);
function strNums(s){if(typeof s!=='string')return [];return s.trim().split(/[;\s]+/).filter(Boolean).map(x=>Number(x.replace(',','.')))}
function evaluate(item,v){if(v===undefined||String(v).trim()==='')return false;
 if(item.kind==='select')return String(v)===item.answer;
 if(item.kind==='numbers'){const n=strNums(v);return n.length===item.answer.length&&n.every((x,i)=>Number.isFinite(x)&&Math.abs(x-item.answer[i])<.011)}
 const x=String(v).toUpperCase().replace(/\s/g,'').replace(/^[+]/,'');
 if(item.kind==='formulaSum')return x==='=A2*C2+B2*D2'||x==='=B2*D2+A2*C2';
 if(item.kind==='formulaIf')return /^=(?:ЕСЛИ|IF)\(E2>=0[.,]9[;,]1[;,]0\)$/.test(x);
 if(item.kind==='formulaRegression')return x==='=4*A2+1'||x==='=A2*4+1';
 return false}
function grade(i){return assessment[i].reduce((s,q)=>s+(evaluate(q,state.values[q.id])?(q.points||1):0),0)}
function total(){let score=0,done=0;assessment.forEach((_,i)=>{if(state.checked[i]){done++;score+=grade(i)}});return {score,done}}
function qhtml(q,n,i){const val=state.values[q.id]??'';const checked=state.checked[i];const good=evaluate(q,val);const el=q.kind==='select'?`<select data-answer="${q.id}" aria-label="Задание ${n}"><option value="">Выберите ответ</option>${q.opts.map((o,k)=>`<option value="${k}" ${String(k)===String(val)?'selected':''}>${h(o)}</option>`).join('')}</select>`:`<input type="text" data-answer="${q.id}" value="${h(val)}" placeholder="${h(q.placeholder||'Введите ответ')}" autocomplete="off" spellcheck="false" aria-label="Задание ${n}">`;
 return `<div class="practice-question"><div class="q-number">ЗАДАНИЕ ${n} · 1 балл</div><label class="prompt" for="unused-${q.id}">${h(q.q)}</label>${el}${checked?`<div class="feedback ${good?'correct':'incorrect'}">${good?'✓ Верно.':'✕ Не совсем. '}${!good?h(q.ex):''}</div>`:''}</div>`}
function renderPractice(i){const questions=assessment[i],t=total(),max=topics[i].points,done=!!state.checked[i];let msg='';if(t.done===8){msg=`<div class="summary"><h4>Итог: ${t.score} из 28 баллов</h4><p>${t.score>=23?'Отличная подготовка. Повтори только задания с ошибками.':t.score>=16?'Повтори темы, в которых были ошибки.':'Разбери ошибочные задания и пройди тренировку повторно.'}</p></div>`}
 return `<div class="content"><div class="definition">Реши задания самостоятельно. После проверки увидишь правильные объяснения.</div><div class="block" style="margin-top:22px">${questions.map((q,n)=>qhtml(q,n+1,i)).join('')}</div>${msg}</div><div class="practice-actions"><div class="score">${done?`${grade(i)} / ${max} баллов`:'Не проверено'}<div class="muted">Всего: ${t.score} / 28 · Проверено разделов: ${t.done} / 8</div></div><button class="btn" data-action="check">${done?'Проверить снова':'Проверить раздел'}</button></div>`}
function qbox(i,q,answer){return `<div class="question"><p>${q}</p><button class="btn secondary" data-action="reveal">${state.visible[i]?'Скрыть ответ':'Показать ответ'}</button>${state.visible[i]?`<div class="answer"><strong>Разбор</strong><p>${answer}</p></div>`:''}</div>`}
function lesson0(){return `<div class="block"><div class="cards2"><div class="tile"><span class="flag">РАНЬШЕ</span><strong>Экспертные системы</strong><p>Решения по правилам и базе знаний, заданным человеком.</p></div><div class="tile"><span class="flag">ПОЗЖЕ</span><strong>Глубокое обучение</strong><p>Нейросети обучаются на большом количестве примеров.</p></div></div></div><div class="block"><h4>Почему ИИ стал мощнее?</h4><div class="cards3"><div class="tile"><strong>Вычисления / GPU</strong><p>Ускоряют обучение сложных моделей.</p></div><div class="tile"><strong>Данные</strong><p>Помогают находить закономерности и обобщать.</p></div><div class="tile"><strong>Алгоритмы</strong><p>Позволяют обучать более сложные нейросети.</p></div></div></div>${qbox(0,'Почему недостаточно просто написать «появились GPU»?','Нужно указать влияние: GPU выполняют вычисления параллельно и ускоряют обучение нейросетей.')}`}
function lesson1(){return `<div class="block"><div class="definition">Пример: по <b>пробегу</b> и <b>году выпуска</b> автомобильной модели предсказываем <b>цену</b>.</div></div><div class="block"><div class="cards2"><div class="tile"><strong>Обучающие данные</strong><p>Примеры автомобилей: пробег, год и известная цена продажи.</p></div><div class="tile"><strong>Признаки</strong><p>Пробег и год выпуска — то, что подаём на вход.</p></div><div class="tile"><strong>Обучение</strong><p>Процесс настройки модели по известным примерам.</p></div><div class="tile"><strong>Модель и прогноз</strong><p>Настроенная зависимость выдаёт предполагаемую цену нового авто.</p></div></div></div>${qbox(1,'Цена продажи в обучающей таблице — это признак или правильный ответ?','Это известный правильный результат (целевая величина). Признаки — пробег и год выпуска.')}`}
function lesson2(){return `<div class="block"><div class="perceptron-visual"><div class="node">Входы<big>x₁, x₂</big></div><div class="line">→</div><div class="node">Сумма<big>S</big></div><div class="line">→</div><div class="node output">Выход<big>0 / 1</big></div></div><div class="cards3"><div class="tile"><strong>Входы</strong><p>Признаки объекта: например, движение и темнота.</p></div><div class="tile"><strong>Веса</strong><p>Определяют, насколько сильно влияет каждый признак.</p></div><div class="tile"><strong>Активация</strong><p>Сравнивает сумму с порогом и выдаёт 0 или 1.</p></div></div></div>${qbox(2,'Если вес первого признака увеличился, что изменится?','Вклад первого признака в сумму S увеличится (если вход x₁ положительный). Из-за этого выход может переключиться с 0 на 1.')}`}
function lesson3(){let p=state.per;return `<div class="block"><div class="definition">Сумма: <b>S = x₁w₁ + x₂w₂.</b> Правило: если S ≥ порога, то y = 1; иначе y = 0.</div></div><div class="block"><h4>1. Выбери входы</h4><div class="toggles"><button class="toggle ${p.x1?'on':''}" data-action="toggle-per" data-key="x1">x₁ = ${p.x1}</button><button class="toggle ${p.x2?'on':''}" data-action="toggle-per" data-key="x2">x₂ = ${p.x2}</button></div></div><div class="block editor"><h4>2. Измени веса и порог</h4>${[['w1','Вес w₁',0,1,.1],['w2','Вес w₂',0,1,.1],['t','Порог',.1,1.5,.1]].map(([key,label,min,max,step])=>`<div class="slider-row"><label for="p-${key}">${label}</label><input type="range" id="p-${key}" data-per="${key}" min="${min}" max="${max}" step="${step}" value="${p[key]}"><output id="p-out-${key}">${ru(p[key])}</output></div>`).join('')}</div><div class="block"><div class="math-card"><div><span>Взвешенная сумма</span><br><strong id="per-calc"></strong></div><div><span>Выход нейрона</span><br><strong id="per-out"></strong></div></div><p class="dim" id="per-rule"></p></div><div class="block"><h4>3. Формулы электронной таблицы</h4><div class="stack"><div><span class="dim">Сумма в E2: </span><code class="formula">=A2*C2+B2*D2</code></div><div><span class="dim">Выход в F2 (порог 0,8): </span><code class="formula">=ЕСЛИ(E2>=0,8;1;0)</code></div></div></div>${qbox(3,'Входы x₁ = x₂ = 1; веса 0,4 и 0,3; порог 0,8. Что произойдёт, если увеличить w₂ до 0,5?','Сначала S = 0,7 и y = 0. После изменения S = 0,4 + 0,5 = 0,9. Порог достигнут: y = 1.')}`}
function lesson4(){return `<div class="block"><div class="cards3"><div class="tile"><span class="flag">С УЧИТЕЛЕМ</span><strong>Есть готовые ответы</strong><p>Фотографии с подписями «кот» / «собака».</p></div><div class="tile"><span class="flag">БЕЗ УЧИТЕЛЯ</span><strong>Нет готовых меток</strong><p>Алгоритм самостоятельно ищет группы похожих объектов.</p></div><div class="tile"><span class="flag">С ПОДКРЕПЛЕНИЕМ</span><strong>Награды и штрафы</strong><p>Агент учится выбирать действия по вознаграждению.</p></div></div></div>${qbox(4,'Музыкальный сервис сам группирует песни без заранее указанных жанров. Какой это вид обучения и почему?','Без учителя: готовых меток нет, алгоритм находит группы похожих песен.')}`}
function kmAxis(){const vals=[2,5,8,14,17,20],st=state.kmStep;let a=st>=2?5:2,b=st>=2?17:20;const pos=v=>((v/22)*100).toFixed(3);return `<div class="axis-box"><div class="axis">${[0,5,10,15,20].map(v=>`<span class="axis-tick" style="left:${pos(v)}%">${v}</span>`).join('')}${vals.map((v,i)=>`<div class="dot ${st?(i<3?'group-a':'group-b'):''}" style="left:${pos(v)}%" title="Число ${v}">${v}</div>`).join('')}<div class="center-mark" style="left:${pos(a)}%">C₁ = ${a}</div><div class="center-mark right" style="left:${pos(b)}%">C₂ = ${b}</div></div></div>`}
function lesson5(){const st=state.kmStep;return `<div class="block"><p class="lead">Числа: 2, 5, 8, 14, 17, 20. Начальные центры C₁ = 2 и C₂ = 20.</p></div><div class="block" id="km-axis">${kmAxis()}</div><div class="block controls"><button class="btn" data-action="km-next" ${st===2?'disabled':''}>${st===0?'1. Распределить по центрам':st===1?'2. Пересчитать центры':'Готово'}</button><button class="btn ghost" data-action="km-reset">Сначала</button></div>${st>=1?`<div class="block result"><div><b>Группа 1:</b> 2, 5, 8<br><b>Группа 2:</b> 14, 17, 20</div><span class="status-tag ok">Ближайшие центры</span></div>`:''}${st>=2?`<div class="block result"><div><b>C₁ = (2 + 5 + 8) / 3 = 5</b><br><b>C₂ = (14 + 17 + 20) / 3 = 17</b></div><span class="status-tag ok">Новые центры</span></div>`:''}<div class="block definition">Алгоритм повторяет распределение и пересчёт центров, пока группы не перестанут меняться. В Excel центр: <code class="formula">=СРЗНАЧ(A2:A4)</code></div>${qbox(5,'k-means относит новое число к готовому классу или формирует группы?','Формирует группы похожих объектов. Центр каждой группы равен среднему значению её объектов.')}`}
function knnAxis(){const points=[{x:2,c:'А'},{x:6,c:'Б'},{x:9,c:'А'},{x:12,c:'Б'},{x:15,c:'А'}],neighbors=[...points].sort((a,b)=>Math.abs(a.x-8)-Math.abs(b.x-8)).slice(0,state.knnK);let pos=v=>(v/17*100).toFixed(3);return `<div class="axis-box"><div class="axis">${[0,4,8,12,16].map(v=>`<span class="axis-tick" style="left:${pos(v)}%">${v}</span>`).join('')}${points.map(v=>`<div class="dot ${state.knnReveal&&neighbors.includes(v)?'near':''}" style="left:${pos(v.x)}%" title="x=${v.x}, класс ${v.c}">${v.c}</div>`).join('')}<div class="dot target" style="left:${pos(8)}%">?</div></div></div>`}
function lesson6(){const k=state.knnK;return `<div class="block"><div class="definition">Новый объект: <b>x = 8</b>. Расстояние до каждого примера: <b>|x − 8|</b>.</div></div><div class="block"><div id="knn-axis">${knnAxis()}</div><div class="legend"><span>Буква внутри точки — её класс</span><span>Тёмная точка — новый объект</span></div></div><div class="block"><h4>Выбери количество соседей</h4><div class="controls"><button class="toggle ${k===1?'on':''}" data-action="knn-set" data-k="1">k = 1</button><button class="toggle ${k===3?'on':''}" data-action="knn-set" data-k="3">k = 3</button><button class="btn" data-action="knn-show">Показать соседей</button></div></div>${state.knnReveal?`<div class="block result"><div><span class="dim">Ближайшие соседи:</span><br><strong>${k===1?'9 (А)':'9 (А), 6 (Б), 12 (Б)'}</strong></div><div><span class="dim">Прогноз</span><br><strong>Класс ${k===1?'А':'Б'}</strong></div></div>`:''}<div class="block definition">k-NN выбирает класс по большинству среди k ближайших соседей. При k = 1 и k = 3 результат может быть разным.</div>${qbox(6,'Почему при k = 1 может получиться другой класс, чем при k = 3?','k = 1 учитывает только ближайший объект; k = 3 — большинство среди трёх ближайших. В нашем примере: А и Б соответственно.')}`}
function lesson7(){return `<div class="block"><div class="definition">Формула линейной регрессии: <b>y = 3x + 2.</b> x — число тренировочных задач, y — прогнозируемый балл.</div></div><div class="block editor"><div class="slider-row"><label for="r-x">Число x</label><input id="r-x" data-reg="x" type="range" min="1" max="8" step="1" value="${state.reg.x}"><output id="r-out-x">${state.reg.x}</output></div><div class="slider-row"><label for="r-fact">Факт</label><input id="r-fact" data-reg="fact" type="range" min="1" max="30" step="1" value="${state.reg.fact}"><output id="r-out-fact">${state.reg.fact}</output></div></div><div class="block"><div class="math-card"><div><span>Прогноз по формуле</span><br><strong id="reg-predict"></strong></div><div><span>Абсолютная ошибка</span><br><strong id="reg-error"></strong></div></div><div style="margin-top:20px"><div class="bar-pair"><span>Прогноз</span><div class="bar-track"><div class="bar" id="reg-bar-pred"></div></div><span id="reg-val-pred"></span></div><div class="bar-pair"><span>Факт</span><div class="bar-track"><div class="bar actual" id="reg-bar-fact"></div></div><span id="reg-val-fact"></span></div></div><p class="dim" id="reg-dir"></p></div><div class="block"><span class="dim">Формула электронной таблицы:</span> <code class="formula">=3*A2+2</code></div>${qbox(7,'Прогноз = 14, факт = 17. Какова ошибка и в какую сторону ошиблась модель?','|14 − 17| = 3. Модель занизила результат на 3 балла.')}`}
const lessons=[lesson0,lesson1,lesson2,lesson3,lesson4,lesson5,lesson6,lesson7];
function updatePer(){const p=state.per,s=Math.round((p.x1*p.w1+p.x2*p.w2)*100)/100,y=s+1e-8>=p.t?1:0;let set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};set('per-calc',`${p.x1}×${ru(p.w1)} + ${p.x2}×${ru(p.w2)} = ${ru(s)}`);set('per-out',`y = ${y}`);set('per-rule',`${ru(s)} ${y?'≥':'<'} ${ru(p.t)} → выход ${y}`);for(let key of ['w1','w2','t'])set('p-out-'+key,ru(p[key]));}
function updateReg(){const s=state.reg,pred=3*s.x+2,err=Math.abs(pred-s.fact),m=Math.max(pred,s.fact,30);let txt=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};txt('r-out-x',s.x);txt('r-out-fact',s.fact);txt('reg-predict',`3 × ${s.x} + 2 = ${pred}`);txt('reg-error',err);txt('reg-val-pred',pred);txt('reg-val-fact',s.fact);txt('reg-dir',pred===s.fact?'Прогноз совпал с фактом.':`Модель ${pred>s.fact?'завысила':'занизила'} результат.`);const a=document.getElementById('reg-bar-pred'),b=document.getElementById('reg-bar-fact');if(a)a.style.width=(pred/m*100)+'%';if(b)b.style.width=(s.fact/m*100)+'%'}
function render(){const i=state.section,t=topics[i],sc=total();const app=document.getElementById('app');app.innerHTML=`<div class="meta"><div><h2>${state.mode==='lesson'?'Разбор тем':'Самостоятельная тренировка'}</h2><p>${state.mode==='lesson'?'Короткое объяснение → пример → проверка ответа':'8 заданий-блоков · 28 баллов · проверка по разделам'}</p></div><span class="time-pill">${state.mode==='lesson'?'40 минут':'28 баллов'}</span></div><nav class="nav" aria-label="Разделы">${topics.map((x,k)=>`<button data-nav="${k}" class="${k===i?'active':''} ${state.checked[k]?'passed':''}"><span class="num">${k+1}</span>${x.short}</button>`).join('')}</nav><main><article class="section"><div class="section-head"><div><div class="eyebrow">ТЕМА ${i+1} / 8</div><h3>${t.title}</h3><p>${t.sub}</p></div><span class="counter">${t.points} ${t.points===5?'баллов':'балла'}</span></div>${state.mode==='lesson'?`<div class="content">${lessons[i]()}</div>`:renderPractice(i)}</article><div class="foot"><button class="btn secondary" data-action="prev" ${i===0?'disabled':''}>← Назад</button><span class="small dim">${state.mode==='lesson'?'Все примеры отличаются от вариантов СОЧ.':'Проверяй каждый раздел после ответов.'}</span><button class="btn" data-action="next" ${i===7?'disabled':''}>Далее →</button></div>${state.mode==='practice'?`<div class="footer-note"><button class="btn secondary" style="margin-top:8px" data-action="reset-practice">Сбросить тренировку</button></div>`:''}</main>`;
 document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===state.mode);b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode))});if(state.mode==='lesson'&&i===3)updatePer();if(state.mode==='lesson'&&i===7)updateReg();}
function move(i){if(i<0||i>7)return;state.section=i;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){state.mode=m.dataset.mode;render();return}const n=e.target.closest('[data-nav]');if(n){move(Number(n.dataset.nav));return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,i=state.section;
 if(a==='next')move(i+1);else if(a==='prev')move(i-1);else if(a==='reveal'){state.visible[i]=!state.visible[i];render()}
 else if(a==='check'){state.checked[i]=true;render()}
 else if(a==='reset-practice'){if(window.confirm('Очистить ответы во всех разделах?')){state.values={};state.checked={};render()}}
 else if(a==='toggle-per'){const k=b.dataset.key;state.per[k]=1-state.per[k];render()}
 else if(a==='km-next'){state.kmStep=Math.min(2,state.kmStep+1);render()}
 else if(a==='km-reset'){state.kmStep=0;render()}
 else if(a==='knn-set'){state.knnK=Number(b.dataset.k);state.knnReveal=false;render()}
 else if(a==='knn-show'){state.knnReveal=true;render()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.answer){state.values[t.dataset.answer]=t.value;if(state.checked[state.section])delete state.checked[state.section];return}if(t.dataset.per){state.per[t.dataset.per]=Number(t.value);updatePer();return}if(t.dataset.reg){state.reg[t.dataset.reg]=Number(t.value);updateReg()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.answer){state.values[t.dataset.answer]=t.value;if(state.checked[state.section])delete state.checked[state.section]}});
render();
</script>
</body>
</html>
