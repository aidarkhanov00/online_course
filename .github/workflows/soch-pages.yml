name: Publish SOCH 10 Trainer
on:
  push:
    branches: [main]
    paths:
      - 'soch-10/**'
      - '.github/workflows/soch-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./soch-10
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
